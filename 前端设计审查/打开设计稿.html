
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="/studio/themes.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F/AI Studio · 电商生产工作台</title>
  <link rel="stylesheet" href="/studio/studio.css">
  <link rel="stylesheet" href="/studio/creation.css">
  <link rel="stylesheet" href="/studio/commerce.css">
  <link rel="stylesheet" href="/studio/glass.css">
  <link rel="stylesheet" href="/studio/workspace.css">
  <link rel="stylesheet" href="/studio/themes.css">
  <link rel="stylesheet" href="/studio/components.css">
  <link rel="stylesheet" href="/studio/live.css">
  <link rel="stylesheet" href="/studio/studio-appearance.css">
  <script defer src="/studio/glass.js"></script>
  <script type="module" src="/studio/live.js"></script>
</head>
<body>
  <div class="aurora-field" aria-hidden="true"></div>
  <svg class="optical-defs" aria-hidden="true" focusable="false"><defs id="glassFilters"></defs></svg>
  <a class="skip" href="#main">跳到工作区</a>
  <div class="app-shell">
    <aside class="rail">
      <a class="brandline" href="#desk"><svg viewBox="0 0 44 44" aria-hidden="true"><path fill="currentColor" d="M6 33 17 6h23L26 16H17l-3 7h14L8 37H4z"/></svg><span>F/AI <i>Studio</i></span></a>
      <nav id="nav" aria-label="主导航"></nav>
      <div class="railFoot"><a href="#account" id="profile"></a></div>
    </aside>
    <div class="app-content">
      <header class="topline">
        <div id="crumb"></div>
        <div class="topActions">
          <span id="connection" class="localState" role="status">正在连接</span>
          <button type="button" class="appearanceButton" data-theme-open aria-haspopup="dialog"><i aria-hidden="true"></i><span>雾白工作台</span></button>
          <button type="button" class="motionToggle" data-motion-toggle><span>暂停动效</span></button>
          <a href="#tasks" id="queueLink" hidden>任务记录</a>
        </div>
      </header>
      <div class="work"><main id="main" tabindex="-1"><p>正在检查服务和登录状态…</p></main></div>
    </div>
  </div>
  <div id="live" class="toast" role="status"></div>
  <noscript>请启用 JavaScript 后重新打开工作台。</noscript>
</body>
</html>
