              <div class="plugin-foot">
                <span data-scene-count=""></span>
                <a href="#desk/operations" aria-label="进入AI 运营">进入工作台 →</a>

            <article class="glass-card plugin-card stagger-card" style="--i:5" data-spotlight data-plugin-name="电商文案 标题 卖点 违禁词 极限词 英文" data-scene="copywriting">
              <div>
                <div class="plugin-head">
                  <div class="plugin-icon">
                    <svg width="19" height="19" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>

              <div style="font-weight:var(--w-medium);font-size:var(--card-title-size)">浏览插件市场</div>

<template id="chat-template"><section class="chat-stage agent-home" id="chatStage" aria-labelledby="agent-title">
            <div class="chat-hero stagger-card agent-heading">
              <div class="ai-orb-logo">
                <svg class="mobius-svg-root" viewbox="0 0 120 120" aria-hidden="true">
                  <circle class="mobius-ring-halo" cx="60" cy="60" r="46"></circle>
                  <g class="mobius-ribbon">
                    <path d="M89.9,46.6 C90.2,63.5 67.5,85.2 44.3,86.3 C31.2,86.9 28.5,73.4 35.2,63.5 C43.5,51.2 61.8,37.8 77.2,36.3 C85.8,35.5 89.7,40.4 89.9,46.6 Z" fill="none" style="stroke:var(--logo-rim)" stroke-opacity="0.34" stroke-width="1.6"></path>
                    <path d="M101.8,43.2 C102.6,59.5 76.8,84.4 45.2,85.6 C27.8,86.2 20.4,74.2 26.8,60.6 C34.8,43.8 61.5,35.6 74.8,45.2 C83.4,51.4 79.8,70.5 64.2,82.6 C50.2,93.4 35.8,88.2 38.4,72.4 C41.6,53.2 71.2,31.4 91.6,31.8 C98.8,32.0 101.4,36.8 101.8,43.2 Z" fill="none" style="stroke:var(--logo-rim)" stroke-opacity=".76" stroke-width="2.3" stroke-linejoin="round"></path>
                    <path d="M101.8,43.2 C102.6,59.5 76.8,84.4 45.2,85.6 C27.8,86.2 20.4,74.2 26.8,60.6 C34.8,43.8 61.5,35.6 74.8,45.2 C83.4,51.4 79.8,70.5 64.2,82.6 C50.2,93.4 35.8,88.2 38.4,72.4 C41.6,53.2 71.2,31.4 91.6,31.8 C98.8,32.0 101.4,36.8 101.8,43.2 Z" class="mobius-flow" fill="none" pathLength="360" stroke-width="3.1" stroke-linecap="round" stroke-dasharray="56 304" filter="url(#mobius-glow)"></path>
                  </g>
                  <g text-anchor="middle" dominant-baseline="central">
                    <text class="mobius-digit d1" x="20" y="25" font-size="9">0</text>
                    <text class="mobius-digit d2" x="98" y="22" font-size="9.5">1</text>
                    <text class="mobius-digit d3" x="98" y="98" font-size="9">8</text>
                    <text class="mobius-digit d4" x="22" y="96" font-size="9">7</text>
                  </g>
                </svg>
              </div>
              <h1 id="agent-title">寰球 AI，我帮你</h1>
              <p data-chat-scope=""></p>
            <div class="agent-thread-tools"><select class="agent-history" aria-label="最近对话" hidden="hidden"></select><button type="button" class="plain agent-new" hidden="hidden">新对话</button></div></div>

            <div class="skill-pills-row stagger-card agent-starters" aria-label="快捷任务"></div>

            <div class="chat-messages agent-log" id="chatMessages" role="log" aria-live="polite" aria-label="对话记录"></div>

            <div class="agent-next"></div><div class="stagger-card">
              <form class="composer-box agent-composer card glass-glow-item">
                <div class="glow-bloom" aria-hidden="true"></div>
                <div class="glow-body">
                  <textarea class="composer-input" id="chatInput" aria-label="给工作台助手发消息" placeholder="今天帮你做些什么？按 Enter 发送指令，Shift + Enter 换行" maxlength="4000" rows="2"></textarea>
                </div>
                <div class="glow-rim" aria-hidden="true">
                  <div class="glow-rim-falloff"></div>
                  <div class="glow-rim-core"></div>
                </div>
              </form>
              <div class="composer-submeta agent-status" role="status"></div>
            </div>

            <div class="suggestions-list stagger-card"><a class="suggest-card" href="#create/image/image.detail-page"><span>制作商品详情页长图</span><span aria-hidden="true">↗</span></a><a class="suggest-card" href="#copy-review"><span>检查商品标题和卖点用词</span><span aria-hidden="true">↗</span></a></div>
          </section></template>
<template id="image-studio-template"><div class="studio-layout">

            <div class="glass-card param-column stagger-card"><h1 data-tool-name=""></h1><p data-tool-cost=""></p><div data-task-mount=""></div></div>


            <div class="studio-right">
              <div class="glass-card brief-panel stagger-card"><h2>创作要求</h2><div data-brief-mount=""></div><div class="prompt-chips"><button type="button" class="smallbtn" data-brief-chip="保持商品外观">+ 保持商品外观</button><button type="button" class="smallbtn" data-brief-chip="突出材质细节">+ 突出材质细节</button><button type="button" class="smallbtn" data-brief-chip="使用简洁背景">+ 使用简洁背景</button></div></div>

              <div class="glass-card result-panel stagger-card"><div class="panel-header"><h2>生成结果</h2><div class="live-row"><a class="smallbtn" href="#psd">PSD 分层设计</a><a class="smallbtn" href="#tasks">任务记录</a></div></div><div data-tool-results="">正在读取最近任务…</div></div>
            </div>
          </div></template><aside class="glass-overlay" id="material-overlay" role="dialog" aria-labelledby="mat-title" popover="auto" tabindex="-1">
    <div class="mat-heading">
      <h2 id="mat-title">玻璃材质与流光</h2>
      <button type="button" data-native-reset="">重置</button>
    </div>

    <div class="theme-strip mat-theme" role="group" aria-label="玻璃主题">
      <button type="button" class="theme-choice" data-scheme="dark" aria-pressed="false" data-glass-preset="black">
        <i class="material-dot black" aria-hidden="true"></i><span>黑曜</span>
      </button>
      <button type="button" class="theme-choice" data-scheme="gray" aria-pressed="false" data-glass-preset="gray">
        <i class="material-dot gray" aria-hidden="true"></i><span>雾灰</span>
      </button>
      <button type="button" class="theme-choice active" data-scheme="white" aria-pressed="true" data-glass-preset="white">
        <i class="material-dot white" aria-hidden="true"></i><span>银白</span>
      </button>
    </div>

    <div class="mat-field">
      <div class="mat-field-label">
        <label for="mat-speed">流动速度 <small lang="en">Flow Speed</small></label>
        <output for="mat-speed" id="mat-out-speed">1.0x</output>
      </div>
      <input id="mat-speed" type="range" min="0" max="2.5" step="0.1" value="1.0">
      <div class="mat-limits" aria-hidden="true"><span>0.0x 静止</span><span>2.5x</span></div>
    </div>

    <div class="mat-field">
      <div class="mat-field-label">
        <label for="mat-blur">模糊半径 <small lang="en">Blur</small></label>
        <output for="mat-blur" id="mat-out-blur">24px</output>
      </div>
      <input id="mat-blur" type="range" min="0" max="40" step="1" value="24">
      <div class="mat-limits" aria-hidden="true"><span>0px</span><span>40px</span></div>
    </div>

    <div class="mat-field">
      <div class="mat-field-label">
        <label for="mat-alpha">玻璃浓度 <small lang="en">Opacity</small></label>
        <output for="mat-alpha" id="mat-out-alpha">0.50</output>
      </div>
      <input id="mat-alpha" type="range" min="0.15" max="0.88" step="0.01" value="0.50">
      <div class="mat-limits" aria-hidden="true"><span>0.15</span><span>0.88</span></div>
    </div>

    <div class="mat-field">
      <div class="mat-field-label">
        <label for="mat-sat">背景饱和度 <small lang="en">Saturate</small></label>
        <output for="mat-sat" id="mat-out-sat">165%</output>
      </div>
      <input id="mat-sat" type="range" min="100" max="220" step="1" value="165">
      <div class="mat-limits" aria-hidden="true"><span>100%</span><span>220%</span></div>
    </div>

    <label class="mat-shadow" for="mat-shadow">
      <span>标题光学微阴影</span>
      <span class="mat-shadow-control">
        <input id="mat-shadow" type="checkbox" role="switch" checked>
        <span class="apple-switch" aria-hidden="true"></span>
      </span>
    </label>
  <div class="mat-actions"><button data-more-appearance type="button" class="btn">更多外观与壁纸</button><button data-motion-toggle type="button" class="btn"><span>暂停动效</span></button></div></aside>
<dialog class="ui-dialog" id="studio-about" aria-labelledby="studio-about-title"><header class="ui-dialog-header"><h2 id="studio-about-title">关于寰球 AI</h2></header><div class="ui-dialog-body"><p>电商工作台连接当前工作区的商品、素材、任务与插件。</p></div><form method="dialog" class="ui-dialog-footer"><button class="primary">关闭</button></form></dialog>
<div id="live" class="toast" role="status"></div>
