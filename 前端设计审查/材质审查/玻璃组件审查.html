<header><div class="topwrap"><b class="brand"><svg viewBox="0 0 44 44" aria-hidden="true"><path fill="#b9abf6" d="M6 33 17 6h23L26 16H17l-3 7h14L8 37H4z"/></svg> F/AI <i>Studio</i></b><span class="divider"></span><span>组件审查</span><small>本地预览</small></div></header>
<main>
<div class="intro"><div><h1>液态玻璃组件</h1><p>青绿与浅紫的极光穿过玻璃，拖动或切换时可以试试回弹手感。</p></div><button class="reset" id="reset" type="button">↺　恢复默认</button></div>
<section class="stage" aria-label="可交互的材质画板">
<canvas id="back" aria-hidden="true"></canvas>
<div class="sceneSwitch" role="group" aria-label="画板背景"><button data-bg="night" aria-pressed="true">深靛</button><button data-bg="blue" aria-pressed="false">海蓝</button></div>
<div class="plate pane" id="plate" aria-label="快捷工具浮板">
 <canvas class="lens" aria-hidden="true"></canvas>
 <div class="surface"></div>
 <button class="plateHead" id="grip" title="拖动浮板；聚焦后按方向键微调" aria-label="移动快捷工具浮板，支持拖动和方向键"><b>快捷工具</b><span aria-hidden="true">⠿</span></button>
 <div class="toolgrid" id="tools" role="group" aria-label="快捷工具"></div>
</div>
<div class="modeBox" id="modeBox"><span class="modeTitle">创作模式</span>
 <div class="segment pane" id="segment" role="group" aria-label="创作模式">
 <canvas class="lens" aria-hidden="true"></canvas><div class="surface"></div><div class="thumb" aria-hidden="true"></div>
 <button id="photo" data-mode="photo" aria-pressed="true"><span class="ico"></span>图文</button>
 <button id="video" data-mode="video" aria-pressed="false"><span class="ico"></span>视频</button>
 </div>
</div>
</section>
<div class="controls">
 <div class="ctrl"><strong>玻璃底色</strong><div class="colors" role="group" aria-label="玻璃底色"><button data-color="ice" aria-pressed="true"><i></i>冰蓝</button><button data-color="lilac" aria-pressed="false"><i></i>雾紫</button></div></div>
 <div class="ctrl density"><label for="density">底色浓度</label><input type="range" id="density" min="0" max="24" step="1" value="12"><output id="densityVal" for="density">12%</output></div>
 <button class="motion-button" id="motionToggle" type="button"><svg viewBox="0 0 12 12" aria-hidden="true"><path id="motionIcon" d="M2 1h3v10H2zM7 1h3v10H7z"/></svg><span id="motionLabel">暂停动效</span></button>
</div>
<div class="summary"><div><span class="ring"></span><strong>快捷工具浮板</strong><p>按住标题拖过光带，松手时浮板会轻轻回弹。</p></div><div><span class="pillIcon"></span><strong>创作模式切换器</strong><p>点选图文或视频，观察滑块在落位前的轻微伸缩。</p></div></div>
<p id="announce" role="status" class="sr"></p>

   const lx=(i+.5)/ratio-hw,edge=-roundedDistance(lx,ly,hw,hh,R);
   if(edge<-.5)continue;
   let vx=Math.max(0,Math.abs(lx)-hw+R)*Math.sign(lx);
   let vy=Math.max(0,Math.abs(ly)-hh+R)*Math.sign(ly);
   const len=Math.hypot(vx,vy);
   if(len>.0001){vx/=len;vy/=len}else if(hw-Math.abs(lx)<hh-Math.abs(ly)){vx=Math.sign(lx)}else{vy=Math.sign(ly)}
   const bevel=Math.min(17,R*.65), t=clamp(edge/bevel,0,1);
   const bend=Math.pow(1-t,2.1)*(el===plate?19:12);
   const index=j*cw+i;
   xMap[index]=Math.round((hw+lx*.976-vx*bend)*ratio);
   yMap[index]=Math.round((hh+ly*.976-vy*bend)*ratio);
   const shine=.6*Math.max(0,-vx*.7-vy*.6)+.32*Math.max(0,vx*.28+vy*.9);
   const rim=shine*(Math.exp(-Math.pow((edge-1.35)/1.1,2))*126+Math.exp(-Math.pow((edge-4.1)/1.9,2))*24);
   highlights[index]=Math.round(rim);

}
function lens(el,source){
 const {ctx,img,xMap,yMap,highlights}=lensMap(el);
 const stageBox=stage.getBoundingClientRect(),box=el.getBoundingClientRect();
 const x=Math.round((el===plate ? ui.x : box.left-stageBox.left)*density);
 const y=Math.round((el===plate ? ui.y : box.top-stageBox.top)*density);
 const alpha=ui.amount/100, base=1-alpha, tint=inks[ui.color].map(value=>value*alpha);
 const output=img.data,original=source.data,w=source.width,h=source.height;
 for(let i=0;i<xMap.length;i++){
   const pi=i*4;
   if(!output[pi+3])continue;
   const sx=clamp(x+xMap[i],0,w-1),sy=clamp(y+yMap[i],0,h-1),si=(sy*w+sx)*4;
   const rim=highlights[i];
   for(let k=0;k<3;k++)output[pi+k]=original[si+k]*base+tint[k]+rim;
 }

}
function lowerComposite(){
 if(lowerCanvas.width!==back.width || lowerCanvas.height!==back.height){lowerCanvas.width=back.width;lowerCanvas.height=back.height}
 const ctx=lowerCanvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(back,0,0);
 const sb=stage.getBoundingClientRect(),b=segment.getBoundingClientRect(),x=b.left-sb.left,y=b.top-sb.top;
 ctx.save();ctx.scale(density,density);ctx.drawImage(segment.querySelector('canvas'),x,y,b.width,b.height);
 const slider=thumb.getBoundingClientRect();
 ctx.beginPath();ctx.roundRect(slider.left-sb.left,slider.top-sb.top,slider.width,slider.height,28);ctx.fillStyle='rgba(226,245,255,.23)';ctx.strokeStyle='rgba(246,252,255,.78)';ctx.fill();ctx.stroke();
 for(const [i,label] of ['图文','视频'].entries()){
   ctx.fillStyle='#f1f5ff';ctx.font='600 14px "Microsoft YaHei", sans-serif';ctx.textAlign='center';
   ctx.fillText(label,x+b.width*(i ? 0.75 : 0.25)+6,y+b.height/2+5);
 }
 ctx.textAlign='left';ctx.font='600 13px "Microsoft YaHei",sans-serif';ctx.fillText('创作模式',x+10,y-9);
 ctx.restore();beneath=ctx.getImageData(0,0,back.width,back.height);
}
function paint(){
 scheduled=false;if(!width||!height)return;
 if(redrawBg)drawBackground();
 if(redrawLower)lens(segment,background);
 const overlaysMode=ui.x+plate.offsetWidth+16>groupBox.offsetLeft && ui.x-16<groupBox.offsetLeft+groupBox.offsetWidth
    && ui.y+plate.offsetHeight+16>groupBox.offsetTop && ui.y-16<groupBox.offsetTop+groupBox.offsetHeight;
 if(overlaysMode)lowerComposite();
 lens(plate,overlaysMode ? beneath : background);redrawBg=false;redrawLower=false;
 if(startedAt!==null && frameTimer===null){
   frameTimer=setTimeout(()=>{frameTimer=null;requestPaint(true)},34);
 }
}
function setPos(x,y){
 ui.x=clamp(x,7,width-plate.offsetWidth-7);ui.y=clamp(y,7,height-plate.offsetHeight-7);
 plate.style.left=ui.x+'px';plate.style.top=ui.y+'px';
}
function layout(){
 const oldWidth=width,oldHeight=height;width=stage.clientWidth;height=stage.clientHeight;density=Math.min(window.devicePixelRatio||1,1.5);
 const small=width<610;
 groupBox.style.left=clamp(small?(width-groupBox.offsetWidth)*.55:width*.63,8,width-groupBox.offsetWidth-8)+'px';
 groupBox.style.top=(height*(small ? 0.65 : 0.29))+'px';
 if(!ui.moved)setPos(small?(width-plate.offsetWidth)/2:width*.435-plate.offsetWidth/2,height*(small ? 0.18 : 0.57)-(small?0:plate.offsetHeight/2));
 else setPos(ui.x*width/(oldWidth||width),ui.y*height/(oldHeight||height));
 requestPaint(true);
}
function syncTools(){
 $('tools').innerHTML=toolsByMode[ui.mode].map(([n,k],i)=>'<button data-tool="'+i+'" aria-pressed="'+(ui.selected[ui.mode]===i)+'">'+icon(k)+'<span>'+n+'</span></button>').join('');
}
function syncAppearance(){
 stage.style.setProperty('--tint',inks[ui.color].join(','));stage.style.setProperty('--amount',ui.amount/100);
 $('density').value=ui.amount;$('densityVal').value=ui.amount+'%';
 for(const key of ['bg','color','mode'])document.querySelectorAll('[data-'+key+']').forEach(b=>b.setAttribute('aria-pressed',b.dataset[key]===ui[key]));
 segment.dataset.selected=ui.mode;syncTools();requestPaint(false,true);
}
$('photo').querySelector('.ico').innerHTML=icon('main');$('video').querySelector('.ico').innerHTML=icon('film');
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tool!==undefined){ui.selected[ui.mode]=Number(b.dataset.tool);$('tools').querySelectorAll('button').forEach(el=>el.setAttribute('aria-pressed',el===b));$('announce').textContent='已选 '+b.textContent;return}
 if(b.dataset.mode && ui.mode!==b.dataset.mode){ui.mode=b.dataset.mode;syncAppearance();jelly(thumb);$('announce').textContent='已切换为'+b.textContent+'工具'}
 if(b.dataset.bg){ui.bg=b.dataset.bg;syncAppearance();requestPaint(true)}
 if(b.dataset.color){ui.color=b.dataset.color;syncAppearance()}
 if(b.id==='reset'){Object.assign(ui,{bg:'night',color:'ice',amount:12,mode:'photo',moved:false,selected:{photo:0,video:0}});elapsed=0;startedAt=null;motionEnabled=!reducedMotion.matches;syncPlayback();applyLight(null);syncAppearance();layout();$('announce').textContent='已恢复默认材质、位置和动效'}
});
$('density').oninput=e=>{ui.amount=Number(e.target.value);$('densityVal').value=ui.amount+'%';stage.style.setProperty('--amount',ui.amount/100);requestPaint(false,true)};
function applyLight(e){const box=plate.getBoundingClientRect();plate.style.setProperty('--px',e?clamp((e.clientX-box.left)/box.width*100,0,100)+'%':'30%');plate.style.setProperty('--py',e?clamp((e.clientY-box.top)/box.height*100,0,100)+'%':'0%')}
plate.onpointermove=applyLight;plate.onpointerleave=()=>applyLight(null);
let drag=null;
$('grip').onpointerdown=e=>{if(e.button!==0)return;drag={id:e.pointerId,ox:e.clientX-ui.x,oy:e.clientY-ui.y};$('grip').setPointerCapture(e.pointerId)};
$('grip').onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;ui.moved=true;setPos(e.clientX-drag.ox,e.clientY-drag.oy);requestPaint()};
$('grip').onpointerup=e=>{if(drag && drag.id===e.pointerId)jelly(plate)};
$('grip').onlostpointercapture=()=>{drag=null};
$('grip').onkeydown=e=>{const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(delta){e.preventDefault();ui.moved=true;setPos(ui.x+delta[0]*(e.shiftKey?20:6),ui.y+delta[1]*(e.shiftKey?20:6));requestPaint()}};
syncAppearance();syncPlayback();ribbon.onload=()=>requestPaint(true);ribbon.src=ribbonSource;
new ResizeObserver(layout).observe(stage);layout();
</script></body></html>
